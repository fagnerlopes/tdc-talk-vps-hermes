# Basic-auth na frente do Loki.
#
# POR QUE NAO NO TRAEFIK: o Coolify ESCAPA `${VAR}` em `labels:` para
# `$${VAR}` (ele substitui variavel em `environment:`, mas nao em `labels:`).
# O middleware basicauth recebia a string literal `${LOKI_BASIC_AUTH}` como
# lista de usuarios, o Traefik marcava o roteador como invalido e a resposta
# virava 503 "no available server". Como o repositorio e publico, o hash nao
# pode ser escrito direto no compose — entao a autenticacao mora aqui.
#
# O TLS continua sendo do Traefik: ele termina o HTTPS e encaminha para ca.

server {
  listen 3100;
  server_name _;

  auth_basic           "HOSTMASTER Loki";
  auth_basic_user_file /etc/nginx/.htpasswd;

  # Linhas de log podem ser grandes num burst; 0 desliga o limite.
  client_max_body_size 0;

  location / {
    proxy_pass http://loki:3100;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # O Loki nao deve receber o Authorization desta camada: ele roda com
    # auth_enabled: false e o header so confundiria.
    proxy_set_header Authorization "";

    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_buffering    off;
  }
}
