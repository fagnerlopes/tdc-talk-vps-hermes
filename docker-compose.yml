# Stack da demo TDC — HOSTMASTER + Hermes
#
# `app_logs` e o volume que liga API e Promtail. Esse era o ponto exato onde o
# compose da spec original falhava: o Promtail nao tinha acesso a log nenhum.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_DB:-hermes_demo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-hermes_demo}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dev_user:dev123@postgres:5432/hermes_demo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-/var/log/app/api.log}
      PORT: "3001"
      CHECKOUT_FAILURE_RATE: ${CHECKOUT_FAILURE_RATE:-0.5}
      CHECKOUT_MAX_SUCCESS_STREAK: ${CHECKOUT_MAX_SUCCESS_STREAK:-3}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
    volumes:
      - app_logs:/var/log/app

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}

  # loki, promtail e grafana levam o proprio config DENTRO da imagem, em vez de
  # bind mount relativo. O Coolify reescreve binds relativos para um caminho do
  # host onde os arquivos nao estao, o Docker cria um diretorio vazio no lugar do
  # arquivo e o container morre com "not a directory". Ver monitoring/Dockerfile.loki.
  # Volume nomeado continua sendo bind-mountavel sem problema.
  loki:
    build:
      context: ./monitoring
      dockerfile: Dockerfile.loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      # volume NOMEADO, nao bind mount — ver comentario em loki-config.yaml
      - loki_data:/loki
    # Basic-auth NO TRAEFIK, nao na aplicacao: o Loki continua com
    # auth_enabled: false e o Hermes so precisa de `curl -u`.
    #
    # Os dois caminhos INTERNOS nao passam pelo Traefik e NAO sao afetados:
    #   promtail -> http://loki:3100 (push)
    #   grafana  -> http://loki:3100 (datasource)
    # Se o Grafana parar de ver dados depois disto, o problema e outro.
    #
    # O nome do roteador e gerado pelo Coolify a partir do dominio, e o
    # `middlewares=gzip` tambem e dele — por isso `gzip,loki-auth`, e nao so
    # `loki-auth`: sobrescrever o valor derrubaria a compressao. Reconfira com:
    #   api "$COOLIFY/api/v1/applications/$APP" | jq -r '.docker_compose' \
    #     | sed -n '/^  loki:/,/^  [a-z]/p' | grep traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.loki-auth.basicauth.users=${LOKI_BASIC_AUTH}"
      - "traefik.http.routers.https-0-rye22uhkjq7j4qauczrb3jlo-loki-e64c.middlewares=gzip,loki-auth"

  promtail:
    build:
      context: ./monitoring
      dockerfile: Dockerfile.promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    ports:
      - "9080:9080"
    depends_on:
      - loki
    volumes:
      - app_logs:/var/log/app:ro
      - promtail_positions:/promtail

  grafana:
    build:
      context: ./monitoring
      dockerfile: Dockerfile.grafana
    restart: unless-stopped
    ports:
      - "3300:3000"
    depends_on:
      - loki
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  app_logs:
  loki_data:
  promtail_positions:
  grafana_data:
