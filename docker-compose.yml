# Stack da demo TDC — HOSTMASTER + Hermes
#
# `app_logs` e o volume que liga API e Promtail. Esse era o ponto exato onde o
# compose da spec original falhava: o Promtail nao tinha acesso a log nenhum.

# NENHUM servico publica porta no host. Todo acesso externo passa SO pelo Traefik
# do Coolify, nos dominios *.hostmaster.fagnerlopes.dev (campo
# docker_compose_domains da aplicacao). E isso que fecha o Postgres (dev_user /
# dev123 estao neste repositorio publico) e o push anonimo no Loki.
#
# NAO tente fechar com `ufw deny`: o Docker publica porta inserindo regra de DNAT
# na chain DOCKER, avaliada ANTES das regras do ufw na chain filter. Um
# `ufw deny 5432/tcp` num servico com `ports:` deixa a porta aberta e ainda da a
# falsa sensacao de ter fechado.
#
# Para desenvolver localmente sem Traefik, use docker-compose.override.yml
# (gitignored) reintroduzindo os `ports:` que voce precisar.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_DB:-hermes_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-hermes_demo}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dev_user:dev123@postgres:5432/hermes_demo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-/var/log/app/api.log}
      PORT: "3001"
      CHECKOUT_FAILURE_RATE: ${CHECKOUT_FAILURE_RATE:-0.5}
      CHECKOUT_MAX_SUCCESS_STREAK: ${CHECKOUT_MAX_SUCCESS_STREAK:-3}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      # Primeiro admin do painel. So tem efeito com admin_users vazia; se
      # ADMIN_PASSWORD vier vazia, o seed gera 24 chars e imprime uma unica vez
      # no log do container.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hostmaster.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - app_logs:/var/log/app

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
      # O web passa a falar com o Postgres direto (sessoes e admins). Mesma
      # string do servico api.
      DATABASE_URL: ${DATABASE_URL:-postgresql://dev_user:dev123@postgres:5432/hermes_demo}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}

  # loki, promtail e grafana levam o proprio config DENTRO da imagem, em vez de
  # bind mount relativo. O Coolify reescreve binds relativos para um caminho do
  # host onde os arquivos nao estao, o Docker cria um diretorio vazio no lugar do
  # arquivo e o container morre com "not a directory". Ver monitoring/Dockerfile.loki.
  # Volume nomeado continua sendo bind-mountavel sem problema.
  loki:
    build:
      context: ./monitoring
      dockerfile: Dockerfile.loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      # volume NOMEADO, nao bind mount — ver comentario em loki-config.yaml
      - loki_data:/loki

  # Basic-auth para quem vem DE FORA. O dominio publico
  # loki.hostmaster.fagnerlopes.dev aponta para ESTE servico, nao para o loki.
  #
  # POR QUE NAO UM MIDDLEWARE basicauth NO TRAEFIK: o Coolify escapa `${VAR}` em
  # `labels:` para `$${VAR}` — ele substitui variavel em `environment:`, mas nao
  # em `labels:`. O middleware recebia a string literal `${LOKI_BASIC_AUTH}` como
  # lista de usuarios, o Traefik invalidava o roteador e tudo virava 503 "no
  # available server". Escrever o hash direto no compose nao e opcao: o
  # repositorio e publico. Ver monitoring/loki-auth.conf.
  #
  # Os dois caminhos INTERNOS continuam falando com o loki direto e NAO passam
  # por aqui: promtail -> http://loki:3100 (push) e grafana -> http://loki:3100
  # (datasource). Se o Grafana parar de ver dados, o problema e outro.
  loki-auth:
    build:
      context: ./monitoring
      dockerfile: Dockerfile.lokiauth
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      # Linha htpasswd (`usuario:$apr1$...`) em BASE64. Base64 porque o `$` do
      # hash nao sobrevive a interpolacao do Compose — ver o comentario em
      # monitoring/loki-auth-htpasswd.sh. Sem a variavel o container aborta de
      # proposito, para o Loki nunca ficar aberto por engano — a checagem vive no
      # entrypoint, nao no `:?` do compose, porque o parser do Coolify so lida
      # bem com a forma `${VAR:-default}`.
      LOKI_BASIC_AUTH_B64: ${LOKI_BASIC_AUTH_B64:-}

  promtail:
    build:
      context: ./monitoring
      dockerfile: Dockerfile.promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    volumes:
      - app_logs:/var/log/app:ro
      - promtail_positions:/promtail

  grafana:
    build:
      context: ./monitoring
      dockerfile: Dockerfile.grafana
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  app_logs:
  loki_data:
  promtail_positions:
  grafana_data:
